name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          # esp-hal 1.2.2 does not link with 1.99
          version: 1.98.1.0
          buildtargets: esp32s3
          ldproxy: false

      - uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/firmware

      - name: Test render
        working-directory: crates/render
        run: cargo +stable test --release

      - name: Build firmware
        working-directory: crates/firmware
        run: cargo build --release

      - name: Embed crash report symbols
        working-directory: crates/symtab
        run: cargo run --release -- ../firmware/target/xtensa-esp32s3-none-elf/release/sawthat-frame-firmware

      - name: Package artifacts
        run: |
          name="sawthat-frame-${GITHUB_REF_NAME}"
          elf=crates/firmware/target/xtensa-esp32s3-none-elf/release/sawthat-frame-firmware
          mkdir dist
          cp "$elf" "dist/${name}.elf"
          espflash save-image --chip esp32s3 --flash-size 16mb --merge --skip-padding -S "$elf" "dist/${name}.bin"
          cd dist && sha256sum -- * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Assemble site
        run: |
          cp -r site _site
          cp -r docs/examples docs/CONFIG.TXT _site/
          # Named after the version and commit, so browsers never reuse a cached older build
          firmware="sawthat-frame-${GITHUB_REF_NAME}-${GITHUB_SHA::10}.bin"
          cp "dist/sawthat-frame-${GITHUB_REF_NAME}.bin" "_site/$firmware"
          jq -n --arg version "$GITHUB_REF_NAME" --arg revision "${GITHUB_SHA::10}" --arg firmware "$firmware" '{
            name: "SawThat Frame",
            version: $version,
            revision: $revision,
            new_install_prompt_erase: true,
            new_install_improv_wait_time: 0,
            builds: [{chipFamily: "ESP32-S3", parts: [{path: $firmware, offset: 0}]}]
          }' > _site/manifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
