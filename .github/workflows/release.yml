name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          # esp-hal 1.2.2 does not link with 1.99
          version: 1.98.1.0
          buildtargets: esp32s3
          ldproxy: false

      - uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/firmware

      - name: Test render
        working-directory: crates/render
        run: cargo +stable test --release

      - name: Build firmware
        working-directory: crates/firmware
        run: cargo build --release

      - name: Package artifacts
        run: |
          name="sawthat-frame-${GITHUB_REF_NAME}"
          elf=crates/firmware/target/xtensa-esp32s3-none-elf/release/sawthat-frame-firmware
          mkdir dist
          cp "$elf" "dist/${name}.elf"
          espflash save-image --chip esp32s3 --merge --skip-padding -S "$elf" "dist/${name}.bin"
          cd dist && sha256sum -- * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
