[package]
edition      = "2024"
name         = "sawthat-frame-firmware"
rust-version = "1.95"
version      = "0.3.1"

[[bin]]
name = "sawthat-frame-firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.35"

# Pinned: alloc_tcp_state in main.rs relies on TcpClientState being valid when zeroed.
# Re-check that against embassy-net source before upgrading.
embassy-net = { version = "=0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7"
esp-alloc = "0.11.0"
# Backtrace capture only; the panic handler is in `crash`
esp-backtrace = { version = "0.20.0", default-features = false, features = ["esp32s3", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["log"] }
embassy-sync = "0.8"
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

# E-paper display (using local epd module)
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embedded-graphics-core = "0.4"

# JSON parsing (no_std)
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
heapless = "0.9"

# Crash report QR code
qrcodegen-no-heap = "1.8"


# On-device artwork rendering
sawthat-render = { path = "../render" }

# SD card storage for caching
embedded-sdmmc = "0.10"

# Settings flashed by the web installer
esp-storage = { version = "0.10", features = ["esp32s3"] }

# USB drive mode for setup: exposes the SD card over USB OTG
embassy-usb = { version = "0.6", default-features = false }

# HTTP client with TLS support
reqwless = { version = "0.14", default-features = false, features = ["embedded-tls", "alloc"] }
embedded-nal-async = "0.9"
# embedded-tls 0.18 uses der types gated behind this feature without enabling it
der = { version = "0.8", default-features = false, features = ["heapless"] }



[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
